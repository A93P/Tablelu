    }

    .page {
      max-width: 680px;

    }

    }

      font-family: Arial, sans-serif;
      font-size: 14px;
      color: #666;
      margin: 36px 0;
    }

    .pagination a,

      color: #555;
      text-decoration: none;
      margin-right: 10px;
    }

    .subscribe {
      border-top: 1px solid #ddd;
      padding-top: 24px;
      margin-top: 40px;
    }

    input {
      padding: 8px;
      width: 260px;
      border: 1px solid #ccc;

    }

      border: 1px solid #999;
